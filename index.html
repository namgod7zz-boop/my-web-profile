<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Profile</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: #00d2ff;
        }
        p {
            color: #cccccc;
            font-size: 1rem;
            margin: 0 0 20px 0;
            padding-bottom: 16px;
            border-bottom: 1px solid #333333;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background-color: #262626;
            margin-bottom: 12px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            border-left: 4px solid #00d2ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>สวัสดีครับ</h1>
        <p>นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>
        <ul>
            <li>ชื่อเล่น: [ทัศดนัย หอมหวล]</li>
            <li>สิ่งที่กำลังเรียน: GitHub Desktop</li>
        </ul>
    </div>

</body>
</html>
